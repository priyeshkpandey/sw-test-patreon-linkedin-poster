name: Publish held Patreon bundle

# After a repair PR is merged: publish the post that was held by the failed content run,
# then post to LinkedIn.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "content.yml run id that produced the held content-bundle"
        required: true
        type: string
      patreon_mode:
        type: choice
        options: [draft, publish]
        default: publish

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: playwright install --with-deps chromium
      - name: Download held bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.run_id }} -n content-bundle -D held/
      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PATREON_EMAIL: ${{ secrets.PATREON_EMAIL }}
          PATREON_PASSWORD: ${{ secrets.PATREON_PASSWORD }}
          PATREON_MODE: ${{ inputs.patreon_mode }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python -m pipeline.main patreon --bundle held
      - name: Commit state
        if: always()
        run: |
          git config user.name "content-bot"; git config user.email "content-bot@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "chore: update run history [skip ci]" && git pull --rebase && git push)
