name: Create content bundle

# Generates a ready-to-upload Patreon post (+ LinkedIn text) as a downloadable artifact.
# Nothing is posted anywhere; you upload manually.
on:
  workflow_dispatch:
    inputs:
      push_examples:
        description: "Commit the executed experiment to the examples repo (needs EXAMPLES_REPO_TOKEN)"
        type: boolean
        default: true
  # Enable once a manual run looks good:
  # schedule:
  #   - cron: "0 7 * * TUE,FRI"

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Generate bundle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_SEARCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXAMPLES_REPO_TOKEN: ${{ secrets.EXAMPLES_REPO_TOKEN }}
        run: python -m pipeline.main run ${{ inputs.push_examples == false && '--no-push-examples' || '' }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: content-bundle
          path: out/bundle/
          if-no-files-found: error

      - name: Commit run history
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "chore: update run history [skip ci]" && git pull --rebase && git push)
