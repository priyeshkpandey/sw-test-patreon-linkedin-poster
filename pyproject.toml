[project]
name = "sw-test-patreon-linkedin-poster"
version = "0.1.0"
description = "Automated AI-in-testing content: demo -> Patreon post -> LinkedIn promo. See docs/BUILD_PROMPT.md."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "anthropic>=0.40",
    "matplotlib>=3.8",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
